[project]
name = "atominterface"
version = "0.5.1"
description = "Reliable interface modeling for AI4S: coherent interface builder + uMLIP guard layer + thermodynamic profiler."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "AtomInterface contributors"}
]
keywords = ["materials-science", "interface", "mlip", "ase", "pymatgen", "active-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.21",
    "ase>=3.22",
    "typer>=0.9",
    "pydantic>=1.10,<3",
]

[project.optional-dependencies]
pymatgen = ["pymatgen>=2023.0"]
mace = ["mace-torch"]
chgnet = ["chgnet"]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff>=0.17.1,<0.18",
    # No upper bound: every supported interpreter (>=3.12) resolves to mypy 2.x,
    # which is required because the numpy stubs use PEP 695 ``type`` statements
    # that mypy 1.x cannot parse.
    "mypy>=1.0",
    "pyyaml",
]
all = ["atominterface[pymatgen,mace,chgnet,dev]"]

[project.scripts]
atominterface = "atominterface.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["atominterface*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "PL", "UP", "SIM", "TCH"]
ignore = [
    "E501",
    # typer/FastAPI style: Option/Argument objects must be created in the
    # signature default, that is the framework's contract
    "B008",
    "PLR0913",
    "PLR2004",
    # R/F/S matrices are conventional in mechanics tests
    "N803",
    "N806",
    "N807",
    "N816",
    # builders and examples legitimately take many positional arguments
    "PLR0917",
    # optional deps are bound to module-level alias constants so tests can patch them
    "N814",
    # examples/backends use lazy imports by design (optional deps)
    "PLC0415",
    # 2-arg super() is fine in our wrapper classes
    "UP008",
]

[tool.ruff.lint.per-file-ignores]
# package __init__ files re-export at the bottom to keep constants/dataclasses grouped
"src/atominterface/__init__.py" = ["E402"]
"src/atominterface/physics/__init__.py" = ["E402"]
# The relax guard layer is frozen by product decision: no edits until the
# Phase 0.3 review reopens it, even for cosmetic import modernisation.
"src/atominterface/relax/*.py" = ["UP035"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -v"
markers = [
    "slow: long-running tests",
    "needs_pymatgen: requires pymatgen",
    "needs_mace: requires mace-torch (MACE-MP-0 medium weights)",
    "needs_gpu: requires a CUDA-capable device",
]
filterwarnings = [
    "ignore::DeprecationWarning:matplotlib.*",
    "ignore::DeprecationWarning:spglib.*",
    "ignore::DeprecationWarning:pymatgen.*",
    "ignore::UserWarning",
]
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
