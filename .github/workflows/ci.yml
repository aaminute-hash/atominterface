name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # pymatgen is optional; install it when available
          pip install pymatgen || echo "pymatgen install skipped"
          # Real MLIP backends are optional: an install failure must not fail
          # CI, the corresponding tests skip via pytest.importorskip
          pip install torch --index-url https://download.pytorch.org/whl/cpu || echo "torch install skipped"
          pip install mace-torch || echo "mace install skipped"
          pip install chgnet || echo "chgnet install skipped"

      - name: Lint with ruff
        run: ruff check src tests examples

      - name: Format check with ruff
        run: ruff format --check src tests examples

      - name: Type check with mypy
        run: mypy src/atominterface

      - name: Run tests
        run: pytest --cov=atominterface --cov-report=term-missing

      - name: CLI smoke test
        run: |
          atominterface --version
          atominterface builders list-builders

      - name: Example smoke test (dummy backend, no pymatgen required)
        run: python examples/01_build_and_relax.py --backend dummy --outdir /tmp/ai_smoke

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel
        run: |
          pip install --upgrade pip build
          python -m build
          pip install dist/*.whl
          atominterface --version
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
