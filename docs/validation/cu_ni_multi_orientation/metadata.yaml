known_issues:
  - id: registry_unchanged_false_negative
    text: >
      registry_scan.csv 的 registry_unchanged 列在 (111)@21.6 的 fcc-hollow 与
      hcp-hollow 两行为 False，是假阴性。脚本用 np.abs(post_r - pre_r) < 0.01
      比较分数坐标，未做整格回绕，而这两行的 post 恰为 pre 加减 1.0（同一物理位点）。
      判定是否离开初态应以 lateral_pre_A 与 lateral_post_A 是否相等（两行均为
      1.4758 Å）以及 Δsite = 0.0000 Å 为准。
  - id: lateral_110_rounding
    text: >
      (110) 槽位横向偏移：gap_probe.json 实测 2.2137 Å；registry_scan_110.py
      文件头位点表与结果报告 §10.7 记 2.2136 Å（截断所致）。本目录取 JSON 实测值。
  - id: gamma_Ni_110_thickness_dependence
    text: >
      γ_Ni(110) 随厚度有微小变化：10.8 档 2.1209、14.4 档 2.1191、18.0 与 21.6 档
      2.1192 J/m²。汇总表写 2.1192（厚板平台值）；精确值见 registry_vs_thickness.csv。
  - id: fmax_sign_convention
    text: >
      全项目统一：差 = γ(fmax=0.01) − γ(fmax=0.002)，读作默认批次相对收敛值
      偏高多少；与 docs/validation_cu_ni_001.md 第 323/349/351 行一致。
      但该文档 §7 用了收紧方向（A −0.0050、C −0.0006），与上述三处方向相反，
      属已发布文档的内部不一致，待单独修正；在此之前引用该文档的 fmax 相关
      表述须先确认方向。本目录表格在括号内同时给出端点（默认 → 收敛），
      以免符号被读反。

