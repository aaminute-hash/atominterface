caveats:
  - id: no-dft-crosscheck
    text: >
      (001) 有 SCNET 提供的 23 个 VASP 单点对照；(111)/(110) 只有 MACE-MP-0 一个数。
      本目录数值不得与文献值并列成对照，只能标注待独立复核。
  - id: stationary-point-artefacts
    text: >
      0.898 J/m²（(111)@14.4 Å on-top）与 0.5953 J/m²（(110) 脊位）不是数值，
      是对称性锁定的驻点假象。它们出现在文档与 CSV 中仅作为失效模式示例，
      标注为不可引用，不得当作界面能使用。
      两者现状不同：0.5953 仍可复现（PR #30 未触碰 (110)）；0.898 已不可复现
      （见 superseded），只能作为修复前的历史记录引用；
      修复后的重测值为 0.0812 J/m²（见 on_top_remeasured.md）。
  - id: dz-two-conventions
    text: >
      dz 有两个口径：layer_dz（底层 Ni 层平均 z 减顶层 Cu 层平均 z）与
      pair_dz（最近 Cu-Ni 原子对的 z 差）。(110) 槽位两者分别为 1.2306 Å 与
      2.4460 Å，相差一倍多；(111) 上两者相同。混用会得出错误结论。
      源文件存在列命名冲突：registry_scan_110.csv 的 dz_post_A 是 pair_dz，
      gap_probe.json 的 dz_post_A 是 layer_dz。
  - id: fmax-scoped-to-001
    text: >
      差 = γ(fmax=0.01) − γ(fmax=0.002)，读作默认批次相对收敛值偏高多少，
      全项目统一此方向。该差约 +0.0050 J/m²（默认批次相对收敛值）只属于 (001) 的 A 簇（18/36 原子）；
      (111) 在可比原子数（18）下实测仅 1e-4 J/m²，且符号相反，差约 50 倍。
      不得写成 γ_int 的普遍性质。

